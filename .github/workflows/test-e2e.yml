name: E2E tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Erlang, Rebar3, and Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "28"
          gleam-version: "1.16.0"
          rebar3-version: "3"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: examples/mist/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
        working-directory: examples/mist

      - name: Install Gleam dependencies
        run: gleam deps download
        working-directory: examples/mist

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: examples/mist

      - name: Run E2E suite
        run: pnpm exec playwright test --project ${{ matrix.browser }}
        working-directory: examples/mist
        continue-on-error: ${{ matrix.browser == 'webkit' }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ matrix.browser }}
          path: examples/mist/playwright-report/
          if-no-files-found: ignore
